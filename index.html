  const rod = (R, ax, ay, az, bx, by, bz, w, col, em = 1) => {
    const dx = bx - ax, dy = by - ay, dz = bz - az, L = Math.hypot(dx, dy, dz) || 1e-3;
    st.reset(); st.translate((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2); st.rotY(Math.atan2(dx, dz)); st.rotX(-Math.asin(clamp(dy / L, -1, 1)));

class CivLife {
  constructor(view) {

  outfit(c, role, r) {

    if (this.expT <= 0) { this.expT = 2; this.expeditions(t); }

      for (const e of Civ.battlesAt(c.civ, c.site.i, t, Civ.STEP)) {

<script>
'use strict';

const Store = {
  KEY: 'procedurality3d:v1', d: null, _t: 0,
  defaults() {
    return { v: 2, universe: 'ORIGIN', settings: { pixel: 'auto', outline: true, posterize: false, vignette: true, quality: '', fps: false, audio: { master: 0.8, music: 0.55, sfx: 0.8, amb: 0.7, muted: false, breaks: 'normal' } }, clocks: {}, lastSeen: 0, location: null, bookmarks: [], species: [], civs: [], visited: {}, favorites: [], firstRun: true };

  load() {

    if (this.trans) {
      const tr = this.trans; tr.t += dt;
      if (tr.phase === 'out') { this.R.fade = Math.min(1, tr.t / 0.2); if (tr.t >= 0.2) { tr.fn(); tr.phase = 'in'; tr.t = 0; this.R.fade = 1; } }
      else { this.R.fade = Math.max(0, 1 - tr.t / 0.35); if (tr.t >= 0.35) { this.trans = null; this.R.fade = 0; } }
    }
    // a side panel covers the right of the screen: the view slides over to keep its subject visible
    const side = UI.panel.visible && ((!this.mobile && innerWidth > 760) || this.landscape);
    const want = side && this.R.cssW > 0 ? -(this.landscape ? Math.min(innerWidth * 0.46, 420) + 12 : 384) / this.R.cssW : 0;
    this.shift = (this.shift || 0) + (want - (this.shift || 0)) * damp(6, dt);
    this.view.cam.shift = this.shift;
    try {
      this.view.update(dt);
      this.view.render(this.R);
    } catch (e) { console.error(e); if (!this._errShown) { this._errShown = true; UI.toast('Render error: ' + e.message, 'err'); } }
    UI.frame(dt);
    try { Sound.update(dt, this); } catch (e) { console.warn(e); }
    Portraits.process(this.R, this.mobile ? 4 : 7);
    Thumbs.process(this.mobile ? 5 : 8);
    this.crumbT += dt; if (this.crumbT > 1.2) { this.crumbT = 0; UI.crumbs(this.view.crumbs()); }
    this.saveT += dt; if (this.saveT > 4) { this.saveT = 0; this.persist(false); }
    this.feedT = (this.feedT || 0) + dt; if (this.feedT > 1) { this.feedT = 0; try { this.civFeed(); } catch (e) { console.warn(e); } }
    this.fpsAcc += dt; this.fpsN++;
    if (this.fpsAcc > 0.5) { const f = document.getElementById('fps'); if (f && f.style.display !== 'none') f.textContent = `${Math.round(this.fpsN / this.fpsAcc)} fps · ${this.R.low[0]}×${this.R.low[1]}`; this.fpsAcc = 0; this.fpsN = 0; }
  },
  persist(now) {
    if (this.erasing) return;
    // leaving the page: the site's wildlife is remembered too
    if (now && this.view && this.view.name === 'surface') { try { EcoSave.save(this.view); } catch (e) { console.warn(e); } }
    this.syncClock(); Clock.store(); Store.d.lastSeen = Date.now(); Store.d.universe = Universe.name;
    const code = this.locationCode(); if (code) Store.d.location = code;
    Store.save(now);
    this.updateHash();
  },
  updateHash() {
    const code = this.locationCode();
    if (!code || code === this.lastHash) return;
    this.lastHash = code;
    try { history.replaceState(null, '', '#' + encodeURIComponent(code)); } catch (e) { /* file:// quirks */ }
  },
  go(name, params, instant) {
    const doSwitch = () => {
      const next = this.views[name];
      if (this.view && this.view !== next) this.view.exit();
      UI.panel.hide(); UI.quick([]);
      this.view = next;
      try { next.enter(params || {}); } catch (e) { console.error(e); UI.toast('Could not open: ' + e.message, 'err'); }
      UI.crumbs(next.crumbs()); UI.hint(next.hint());
      document.body.dataset.view = name;
      this.updateHash();
    };
    if (instant || !this.view) { doSwitch(); return; }
    if (this.trans && this.trans.phase === 'out') { this.trans.fn = doSwitch; return; }
    this.trans = { t: 0, phase: 'out', fn: doSwitch };
  },
  openGalaxy(star) { this.go('galaxy', { star: star && !star.pocket ? star : null }); },
  openSystem(star, planet) {
    const sv = this.views.system, sys = SystemGen.generate(star);
    if (this.view === sv && sv.sys === sys && !this.trans) { const b = planet && sv.bodies.find((q) => q.p === planet); if (b) sv.select(b, true); return; }
    this.go('system', { system: sys, planet });
  },
  // terraformed worlds are shown as they are now
  living(planet) { try { return Civ.worldOf(planet, this.t) || planet; } catch (e) { console.warn(e); return planet; } },
  openPlanet(planet, site) { planet = this.living(planet); this.go('planet', { planet, system: planet.system, site }); },
  openSurface(planet, dir) { planet = this.living(planet); this.go('surface', { planet, dir, system: planet.system }); },
  back() {
    const v = this.view;
    if (!v) return;
    if (v.name === 'surface') { const t = v.cam.cur.target; this.openPlanet(v.planet, v.surface.dirAt(t[0], t[2])); }
    else if (v.name === 'planet') { const p = v.planet; if (p.isMoon) this.openPlanet(p.parent); else this.openSystem(p.star, p); }
    else if (v.name === 'system') this.openGalaxy(v.sys.star);
    else if (v.selected) v.select(null);
  },
  primary() {
    const v = this.view;
    if (v.name === 'galaxy' && v.selected) this.openSystem(v.selected);
    else if (v.name === 'system' && v.selected) this.openPlanet(v.selected.p);
    else if (v.name === 'planet') v.descend();
    else if (v.name === 'surface' && v.selected) v.follow = v.follow ? null : v.selected;
  },
  setSpeed(s) {
    if (s === 0) Clock.pause(true); else { Clock.pause(false); Clock.speed = s; }
    UI.setSpeedUI(Clock.speed, Clock.paused);
    UI.toast(Clock.paused ? 'Observation frozen — the universe waits' : `Time ×${s}`);
  },
  setAutopilot(on) {
    this.autopilot = on;
    UI.autoBtn.classList.toggle('on', on);
    UI.toast(on ? 'Autopilot: the observer drifts on its own' : 'Autopilot off');
    if (!on && this.view.name === 'surface') this.view.follow = null;
  },
  userActive() { this.lastInput = performance.now(); },
  // follow universe changes made anywhere (seed dialog, codes, links)
  syncClock() {
    if (Clock.universe === Universe.name) return;
    Clock.use(Universe.name);
    this._feedR = null;
  },
  resetClock() {
    this.syncClock(); Clock.reset();
    Civ.reset(); this._feedR = null;
    // the remembered wildlife (and the favourites) of this universe belonged to the old timeline
    const v = this.views.surface;
    if (v.eco) v.eco.discarded = true;
    EcoSave.clearUniverse(Universe.name);
    const gone = Favorite.clearUniverse(Universe.name);
    if (gone.length) UI.log(`♥ ${gone.length > 1 ? `${gone.length} favourite creatures (${gone.map((f) => f.name).join(', ')}) belonged` : `${gone[0].name} belonged`} to the old timeline and ${gone.length > 1 ? 'are' : 'is'} no longer among your favourites.`, 'evolve');
    const code = this.locationCode();
    if (code) this.openCode(code, true);
    UI.log(`The clock of universe “${Universe.name}” was reset to cycle 0.`, 'evolve');
    UI.toast(`Universe “${Universe.name}” reset to Cycle 0`, 'ok');
  },
  setUniverse(name) {
    Universe.setSeed(name);
    this.syncClock();
    Store.d.universe = Universe.name; Store.save();
    this.views.galaxy.cam.goal.target = [0, 0, 0];
    this.startDefault(false);
    UI.toast(`Universe “${Universe.name}” generated`, 'ok');
  },
  startDefault(instant) {
    let best = null;
    outer: for (let r = 0; r <= 5; r++) for (let x = -r; x <= r; x++) for (let z = -r; z <= r; z++) {
      if (Math.max(Math.abs(x), Math.abs(z)) !== r) continue;
      for (const s of Universe.sector(x, z).stars) if (SystemGen.generate(s).lifeCount) { best = s; break outer; }
    }
    this.go('galaxy', { star: best, target: [0, 0, 0], snap: true }, instant);
  },
  randomWorld() {
    const r = new RNG.Rand((Math.random() * 4294967295) >>> 0);
    for (let tries = 0; tries < 400; tries++) {
      const sx = r.int(-4000, 4000), sz = r.int(-4000, 4000);
      for (const s of Universe.sector(sx, sz).stars) {
        const sys = SystemGen.generate(s), c = [];
        for (const p of sys.planets) c.push(p, ...p.moons);
        const life = c.filter((q) => q.life.has);
        const pick = life.length && r.chance(0.85) ? r.pick(life) : c.length && tries > 60 ? r.pick(c) : null;
        if (pick) { this.views.galaxy.cam.goal.target = s.pos.slice(); this.views.galaxy.cam.snap(); this.openPlanet(pick); UI.toast(`Warped to ${pick.title}`, 'ok'); return; }
      }
    }
  },
  openCode(str, instant) {
    str = String(str || '').trim().replace(/^#/, '');
    try { str = decodeURIComponent(str); } catch (e) { /* keep */ }
    if (/\$\d+\.\d+$/.test(str)) {
      const base = Codes.parse(str.replace(/\$.*$/, ''));
      if (!base) return false;
      Codes.resolve(base);
      const c = Civ.byCode(str, this.t);
      if (!c) { UI.toast('That civilization has not arisen yet', 'err'); return false; }
      if (c.home.star.pos && !c.home.star.pocket) { this.views.galaxy.cam.goal.target = c.home.star.pos.slice(); this.views.galaxy.cam.snap(); }
      const home = this.living(c.home);
      this.go('planet', { planet: home, system: home.system }, instant);
      setTimeout(() => Modals.civ(this, c), instant ? 900 : 500);
      return true;
    }
    const g = str.match(/^U:([A-Za-z0-9_\-]+)@(-?[\d.]+),(-?[\d.]+)$/);
    if (g) {
      Universe.setSeed(g[1]); Store.d.universe = Universe.name;
      this.go('galaxy', { target: [+g[2], 0, +g[3]], snap: true }, instant);
      return true;
    }
    let site = null;
    const at = str.indexOf('@');
    if (at > 0) {
      const ll = str.slice(at + 1).split(',').map(Number); str = str.slice(0, at);
      if (ll.length === 2 && ll.every(isFinite)) { const la = ll[0] * Math.PI / 180, lo = ll[1] * Math.PI / 180; site = [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)]; }
    }
    const addr = Codes.parse(str);
    if (!addr) return false;
    const res = Codes.resolve(addr);
    if (!res) return false;
    Store.d.universe = Universe.name;
    if (res.star.pos && !res.star.pocket) { this.views.galaxy.cam.goal.target = res.star.pos.slice(); this.views.galaxy.cam.snap(); }
    if (res.planet) { const pl = this.living(res.planet); if (site) this.go('surface', { planet: pl, dir: site, system: res.system }, instant); else this.go('planet', { planet: pl, system: res.system }, instant); }
    else this.go('system', { system: res.system }, instant);
    return true;
  },
  locationCode() {
    const v = this.view;
    if (!v) return '';
    switch (v.name) {
      case 'galaxy': { const t = v.cam.goal.target; return `U:${Universe.name}@${Math.round(t[0])},${Math.round(t[2])}`; }
      case 'system': return Codes.ofStar(v.sys.star);
      case 'planet': return Codes.ofPlanet(v.planet);
      case 'surface': { const t = v.cam.cur.target, ll = v.surface.latLon(t[0], t[2]); return `${Codes.ofPlanet(v.planet)}@${ll[0].toFixed(3)},${ll[1].toFixed(3)}`; }
    }
    return '';
  },
  // live chronicle: new events of the civilizations around the current location
  civFeed() {
    const v = this.view;
    if (!v || this.splashOn) return;
    const star = v.name === 'system' ? v.sys.star : v.name === 'planet' || v.name === 'surface' ? v.planet.star : null;
    if (!star) { this._feedR = null; return; }
    const R = Civ.region(star, this.t);
    if (this._feedR !== R) { this._feedR = R; this._feedT = this.t; return; }
    const since = this._feedT; this._feedT = this.t;
    if (this.t <= since) return;
    const rec = R.byStar.get(star.id);
    let toasts = 0, logged = 0, skipped = 0;
    for (let i = R.events.length - 1; i >= 0 && R.events[i].t > since; i--) {
      const e = R.events[i], cs = e.civs.map((k) => R.civs[k]);
      const local = cs.some((c) => c.rec === rec || c.holdings.some((q) => q.star.id === star.id) || c.colonies.some((q) => q.star.id === star.id));
      const big = ['stage', 'war', 'extermination', 'conquest', 'expansion'].includes(e.kind);
      if (!local && !big) continue;
      // under heavy time acceleration whole chapters pass each second: log the latest, count the rest
      if (logged >= 6) { skipped++; continue; }
      logged++;
      const cls = ['war', 'battle', 'conquest', 'extermination', 'disaster'].includes(e.kind) ? 'civwar' : ['stage', 'terraform', 'colony', 'expansion', 'discovery'].includes(e.kind) ? 'civup' : 'civ';
      UI.log(e.text, cls, () => Modals.civ(this, cs[0]));
      if (local && toasts < 2 && (big || e.kind === 'dawn' || e.kind === 'terraform' || e.kind === 'colony')) { toasts++; UI.toast(e.text, cls === 'civwar' ? 'civwar' : 'civ'); }
    }
    if (skipped) UI.log(`…and ${skipped} more events in this system's history (see each civilization's History)`, 'civ');
  },
  awaySummary() {
    const last = Store.d.lastSeen;
    if (!last) return;
    const elapsed = (Date.now() - last) / 1000;
    if (elapsed < 90) return;
    const now = this.t, then = Math.max(0, now - elapsed), u0 = Universe.name;
    let evolved = 0, worlds = 0;
    for (const b of Store.d.bookmarks.slice(0, 12)) {
      if (b.kind !== 'planet') continue;
      const a = Codes.parse(b.code.split('@')[0]);
      if (!a || (a.u && a.u !== u0)) continue;
      const res = Codes.resolve(a);
      if (!res || !res.planet || !res.planet.life.has) continue;
      const p = res.planet.prepare();
      const A = new Set(Ecology.community(p, then).map((s) => s.code)), Bn = Ecology.community(p, now).map((s) => s.code);
      const n = Bn.filter((c) => !A.has(c)).length;
      if (n) { evolved += n; worlds++; }
    }
    setTimeout(() => {
      UI.log(`While you were away, ${fmt.dur(elapsed)} passed in the universe.`, 'evolve');
      if (evolved) UI.log(`${evolved} new species evolved across ${worlds} of your saved worlds.`, 'evolve');
      UI.toast(`Welcome back — ${fmt.dur(elapsed)} of universal time has passed`, 'ok');
    }, 1200);
  },
};

/* =============================================================================
   SPLASH · pixel-font title card
   ============================================================================= */
const Splash = {
  FONT: {
    P: ['11110', '10001', '10001', '11110', '10000', '10000', '10000'], R: ['11110', '10001', '10001', '11110', '10100', '10010', '10001'],
    O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'], C: ['01110', '10001', '10000', '10000', '10000', '10001', '01110'],
    E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'], D: ['11100', '10010', '10001', '10001', '10001', '10010', '11100'],
    U: ['10001', '10001', '10001', '10001', '10001', '10001', '01110'], A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
    L: ['10000', '10000', '10000', '10000', '10000', '10000', '11111'], I: ['01110', '00100', '00100', '00100', '00100', '00100', '01110'],
    T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'], Y: ['10001', '10001', '01010', '00100', '00100', '00100', '00100'],
    3: ['11110', '00001', '00001', '01110', '00001', '00001', '11110'], '-': ['00000', '00000', '00000', '11111', '00000', '00000', '00000'], ' ': ['00000', '00000', '00000', '00000', '00000', '00000', '00000'],
  },
  logo(text, scale) {
    const cw = 6, W = text.length * cw + 2, H = 10;
    const c = h('canvas', { width: W * scale, height: H * scale, class: 'logo' }), x = c.getContext('2d');
    const rows = ['#ffe28a', '#ffd166', '#ffc043', '#ffa94d', '#ff8f5a', '#ff7a6b', '#ff6b8f'];
    const draw = (ox, oy, col) => {
      [...text].forEach((ch, i) => {
        const g = this.FONT[ch] || this.FONT[' '];
        g.forEach((row, y) => { for (let k = 0; k < 5; k++) if (row[k] === '1') { x.fillStyle = col || rows[y]; x.fillRect((1 + i * cw + k + ox) * scale, (1 + y + oy) * scale, scale, scale); } });
      });
    };
    draw(1, 2, '#1a0f3d'); draw(1, 1, '#5a2a6e'); draw(0, 0);
    return c;
  },
  show(app, fresh) {
    const el = document.getElementById('splash');
    el.innerHTML = '';
    const seed = h('input', { type: 'text', value: Universe.name, maxlength: 24, spellcheck: 'false', 'aria-label': 'Universe seed' });
    const begin = () => {
      const v = Universe.normalize(seed.value);
      if (v !== Universe.name) app.setUniverse(v);
      el.classList.add('out'); app.splashOn = false;
      setTimeout(() => el.classList.add('hidden'), 450);
      if (Store.d.firstRun) { Store.d.firstRun = false; Store.save(); setTimeout(() => UI.toast(app.mobile ? 'Tip: tap a glowing star, then double-tap to enter it' : 'Tip: click a star to inspect it · double-click to enter', 'ok'), 800); }
    };
    const scale = Math.max(2, Math.min(7, Math.floor(Math.min(innerWidth * 0.9, 900) / 84)));
    el.append(h('div', { class: 'splash-card' },
      this.logo('PROCEDURALITY', scale),
      h('div', { class: 'tagline' }, 'An open-universe observatory · 3D'),
      h('p', { class: 'intro' }, 'An infinite, seeded cosmos of stars, worlds and evolving creatures. You do not play a character — you observe. The universe keeps running whether you watch or not.'),
      h('div', { class: 'row seedrow' }, h('span', { class: 'lbl-s' }, 'Universe seed'), seed, h('button', { class: 'ib', title: 'Random seed', onclick: () => { seed.value = Names.word(new RNG.Rand((Math.random() * 4294967295) >>> 0), 2, 3).toUpperCase(); } }, icon('dice'))),
      h('div', { class: 'row splash-go' }, h('button', { class: 'btn primary big', onclick: begin }, icon('play'), h('span', null, fresh && Store.d.lastSeen ? 'Resume observation' : 'Begin observation')),
        app.fsSupported() || app.mobile ? h('button', { class: 'btn big', title: 'Fullscreen (Shift+F)', onclick: () => app.toggleFullscreen() }, icon(app.fsElement ? 'shrink' : 'full'), h('span', null, 'Fullscreen')) : null),
      h('div', { class: 'muted small' }, app.mobile ? 'Drag · pinch · tap · double-tap' : 'Drag · scroll · click · double-click · press ? for help')));
    seed.addEventListener('keydown', (e) => { if (e.key === 'Enter') begin(); e.stopPropagation(); });
    el.classList.remove('hidden', 'out');
    app.splashOn = true;
  },
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
